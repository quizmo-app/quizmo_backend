[project]
name = "quizmo-backend"
version = "0.1.0"
description = "Quizmo FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pyjwt>=2.9.0",
    "pypdf[crypto]>=7.1.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pylint>=3.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"
ignore-patterns = ["^\\.venv"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "redefined-outer-name",
    "duplicate-code",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 20
max-attributes = 10
